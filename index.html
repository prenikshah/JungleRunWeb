  <style>
    * {
      box-sizing: border-box;
      padding: 0;
      margin: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      /* fix mobile viewport menu bar on iOS */
      height: -webkit-fill-available;
      overflow: hidden;
      background-color: #0b0e14;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }

    #unity-container {
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #unity-canvas {
      width: 100%;
      height: 100%;
      background-color: #0b0e14;
    }

    /* Loading overlay */
    #unity-loading-container {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      background-color: #0d1117;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      z-index: 99;
      opacity: 1;
      visibility: visible;
      transition: opacity 0.5s cubic-bezier(0.4, 0, 0.2, 1), visibility 0.5s ease;
      pointer-events: auto;
    }

    #unity-loading-container.finished {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    /* Loading card */
    .loading-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 90%;
      max-width: 360px;
      gap: 16px;
    }

    /* Optional favicon display if desired on the loading screen */
    .loading-favicon {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      margin-bottom: 4px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.35);
      animation: pulse 2s infinite ease-in-out;
    }

    .loading-title {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: #f1f5f9;
      text-transform: uppercase;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
    }

    /* Outer progress bar track */
    #unity-loading-bar {
      position: relative;
      width: 100%;
      height: 8px;
      background-color: rgba(255, 255, 255, 0.1);
      border-radius: 9999px;
      overflow: hidden;
      box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.4);
    }

    /* Inner bar: GPU accelerated scaleX */
    #unity-loading-bar-inner {
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, #10b981 0%, #34d399 50%, #059669 100%);
      border-radius: 9999px;
      transform-origin: 0% 50%;
      transform: scaleX(0.01);
      box-shadow: 0 0 12px rgba(16, 185, 129, 0.55);
      will-change: transform;
    }

    /* Shimmer animation on bar */
    #unity-loading-bar-inner::after {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(
        90deg,
        rgba(255, 255, 255, 0) 0%,
        rgba(255, 255, 255, 0.35) 50%,
        rgba(255, 255, 255, 0) 100%
      );
      animation: shimmer 1.6s infinite ease-in-out;
    }

    @keyframes shimmer {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.95; }
      50% { transform: scale(1.05); opacity: 1; }
    }

    /* Status row: Text & Percentage */
    .loading-info {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      font-weight: 500;
      color: #94a3b8;
    }

    #loading-status {
      letter-spacing: 0.2px;
    }

    #loading-percentage {
      font-variant-numeric: tabular-nums;
      color: #cbd5e1;
      font-weight: 600;
    }
  </style>
</head>

<body>
  <div id="unity-container">
    <canvas id="unity-canvas" tabindex="-1"></canvas>
  </div>

  <div id="unity-loading-container">
    <div class="loading-content">
      <!-- Loading logo removed as requested. To show your favicon above the bar, uncomment below: -->
      <!-- <img src="favicon.ico" class="loading-favicon" alt="JungleRun"> -->
      <div class="loading-title">JungleRun</div>
      <div id="unity-loading-bar">
        <div id="unity-loading-bar-inner"></div>
      </div>
      <div class="loading-info">
        <span id="loading-status">Loading game assets...</span>
        <span id="loading-percentage">0%</span>
      </div>
    </div>
  </div>

  <script src="Build/23bc03db7abb99b47d3c3a5a7ef9e752.loader.js"></script>
  <script>
    var buildUrl = "Build";
    var config = {
      dataUrl: buildUrl + "/53a4f10e2bbcd18a1280f68d557ca7e9.data.unityweb",
      frameworkUrl: buildUrl + "/5130f6d8b432b9b94535247c5cdea41b.framework.js.unityweb",
      codeUrl: buildUrl + "/ef8a2df01076677fea4c395fa32aa87b.wasm.unityweb",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "psgaming",
      productName: "JungleRun",
      productVersion: "0.1",
    };

    var isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
    if (isMobile) {
      // Define a maximum pixel ratio for mobile to avoid rendering at excessive resolutions
      const maxPixelRatioMobile = 2.0;
      config.devicePixelRatio = Math.min(window.devicePixelRatio || 1, maxPixelRatioMobile);
    }

    var canvas = document.querySelector("#unity-canvas");
    var loadingContainer = document.querySelector("#unity-loading-container");
    var loadingBar = document.querySelector("#unity-loading-bar-inner");
    var loadingStatus = document.querySelector("#loading-status");
    var loadingPercentage = document.querySelector("#loading-percentage");

    var targetProgress = 0;
    var displayedProgress = 0;
    var isLoaded = false;
    var animFrame = null;

    // Smooth progress interpolation loop (prevents stutter & visual freezes)
    function renderProgress() {
      if (isLoaded) {
        displayedProgress += (1.0 - displayedProgress) * 0.15;
        if (1.0 - displayedProgress < 0.005) {
          displayedProgress = 1.0;
        }
      } else {
        // Unity progress reaches 0.9 on download complete, then pauses while compiling WASM.
        // During compilation, asymptotically crawl toward 0.98 to indicate engine activity.
        var effectiveTarget = targetProgress;
        if (targetProgress >= 0.9) {
          effectiveTarget = Math.min(0.98, targetProgress + (0.98 - targetProgress) * 0.35);
        }

        // Smooth exponential ease-out
        displayedProgress += (effectiveTarget - displayedProgress) * 0.08;
        if (effectiveTarget - displayedProgress < 0.001) {
          displayedProgress = effectiveTarget;
        }
      }

      var clampedProgress = Math.min(1.0, Math.max(0.01, displayedProgress));
      loadingBar.style.transform = "scaleX(" + clampedProgress + ")";

      var pct = Math.min(100, Math.round(displayedProgress * 100));
      if (loadingPercentage) {
        loadingPercentage.textContent = pct + "%";
      }

      if (loadingStatus) {
        if (isLoaded || displayedProgress >= 0.99) {
          loadingStatus.textContent = "Ready!";
        } else if (displayedProgress >= 0.9) {
          loadingStatus.textContent = "Preparing game engine...";
        } else if (displayedProgress >= 0.5) {
          loadingStatus.textContent = "Loading WebAssembly...";
        } else {
          loadingStatus.textContent = "Downloading assets...";
        }
      }

      if (!isLoaded || displayedProgress < 0.999) {
        animFrame = requestAnimationFrame(renderProgress);
      }
    }

    // Start smooth animation loop
    animFrame = requestAnimationFrame(renderProgress);

    var unityGame;
    createUnityInstance(canvas, config, function(progress) {
      targetProgress = Math.max(targetProgress, progress);
    }).then(function(unityInstance) {
      unityGame = unityInstance;
      isLoaded = true;

      // Clean completion transition
      var finishInterval = setInterval(function() {
        if (displayedProgress >= 0.995) {
          clearInterval(finishInterval);
          loadingContainer.classList.add("finished");
          setTimeout(function() {
            loadingContainer.style.display = "none";
            if (animFrame) cancelAnimationFrame(animFrame);
          }, 550);
        }
      }, 50);
    }).catch(function(message) {
      console.error(message);
      if (loadingStatus) {
        loadingStatus.textContent = "Failed to load game";
        loadingStatus.style.color = "#f87171";
      }
      alert(message);
    });
  </script>
